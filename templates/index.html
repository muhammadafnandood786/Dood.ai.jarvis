<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>JARVIS AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #111827;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.08) 0%, transparent 50%);
    }
    header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .logo span {
      width: 10px; height: 10px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 1.1rem;
      line-height: 1.5;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent2), #5b21b6);
      border-bottom-right-radius: 0.3rem;
    }
    .jarvis {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-bottom-left-radius: 0.3rem;
    }
    .jarvis strong {
      color: var(--accent);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 0.3rem;
    }
    .input-area {
      padding: 1rem 0.5rem 1.5rem;
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }
    #userInput {
      flex: 1;
      background: var(--panel);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 2rem;
      padding: 0.9rem 1.3rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
    }
    button {
      background: linear-gradient(135deg, var(--accent), #0891b2);
      border: none;
      color: #0a0e17;
      width: 48px; height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    button:hover { transform: scale(1.08); }
    button:active { transform: scale(0.95); }
    #micBtn {
      background: linear-gradient(135deg, var(--accent2), #6d28d9);
    }
    #micBtn.listening {
      background: linear-gradient(135deg, var(--danger), #b91c1c);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
      animation: pulse 1s infinite;
    }
    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding-bottom: 0.5rem;
    }
    .welcome {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }
    .welcome h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      margin-bottom: 0.8rem;
      font-size: 1.5rem;
    }
    @media (max-width: 600px) {
      .msg { max-width: 92%; font-size: 0.9rem; }
      header { padding: 1rem; }
      .logo { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span></span> {{ jarvis_name }}
    </div>
    <div class="status" id="statusText">
      {% if ready %}ONLINE • OpenAI{% else %}API KEY MISSING{% endif %}
    </div>
  </header>

  <main>
    <div id="chat">
      <div class="welcome">
        <h2>JARVIS ONLINE</h2>
        <p>Voice or type. I am ready to assist you, {{ owner_name }}.</p>
        <p style="margin-top:0.8rem;font-size:0.8rem;">
          Try: "What time is it?" • "Open YouTube" • "System status" • Ask anything
        </p>
      </div>
    </div>

    <div class="hint" id="hint">Tap mic for voice • Enter to send</div>

    <div class="input-area">
      <button id="micBtn" title="Voice Input">🎤</button>
      <input type="text" id="userInput" placeholder="Speak or type a command..." autocomplete="off" />
      <button id="sendBtn" title="Send">➤</button>
    </div>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const hint = document.getElementById('hint');

    let recognizing = false;
    let recognition = null;

    // Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        recognizing = true;
        micBtn.classList.add('listening');
        hint.textContent = 'Listening... Speak now';
      };
      recognition.onend = () => {
        recognizing = false;
        micBtn.classList.remove('listening');
        hint.textContent = 'Tap mic for voice • Enter to send';
      };
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
      };
      recognition.onerror = (e) => {
        console.error(e);
        hint.textContent = 'Voice error. Try again or type.';
        recognizing = false;
        micBtn.classList.remove('listening');
      };
    } else {
      micBtn.style.opacity = '0.4';
      micBtn.title = 'Voice not supported in this browser';
    }

    micBtn.onclick = () => {
      if (!recognition) {
        alert('Speech recognition not supported. Use Chrome / Edge / Safari.');
        return;
      }
      if (recognizing) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };

    function addMessage(text, isUser) {
      const welcome = chat.querySelector('.welcome');
      if (welcome) welcome.remove();

      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'jarvis');
      if (!isUser) {
        div.innerHTML = `<strong>JARVIS</strong>${escapeHtml(text)}`;
      } else {
        div.textContent = text;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage(data.reply || 'No response', false);

        if ('speechSynthesis' in window && data.reply) {
          const utter = new SpeechSynthesisUtterance(data.reply);
          utter.rate = 1.0;
          utter.pitch = 1.0;
          const voices = speechSynthesis.getVoices();
          const preferred = voices.find(v => v.name.includes('Google') || v.name.includes('Microsoft') || v.lang.startsWith('en'));
          if (preferred) utter.voice = preferred;
          speechSynthesis.speak(utter);
        }
      } catch (err) {
        addMessage('Connection error. Please try again.', false);
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    if ('speechSynthesis' in window) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
